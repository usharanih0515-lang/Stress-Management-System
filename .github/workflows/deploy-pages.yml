name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mini_project-main/new_project/hakuna-matata/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Mini_project-main/new_project/hakuna-matata/frontend
        run: npm ci

      - name: Build frontend
        working-directory: Mini_project-main/new_project/hakuna-matata/frontend
        run: npm run build

      - name: Add SPA fallback
        run: cp Mini_project-main/new_project/hakuna-matata/frontend/build/index.html Mini_project-main/new_project/hakuna-matata/frontend/build/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Mini_project-main/new_project/hakuna-matata/frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
